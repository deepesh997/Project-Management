version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: worksphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: worksphere
      POSTGRES_USER: worksphere_user
      POSTGRES_PASSWORD: worksphere_secure_db_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksphere_user -d worksphere"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worksphere-net

  redis:
    image: redis:7-alpine
    container_name: worksphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worksphere-net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: worksphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://worksphere_user:worksphere_secure_db_pass_2026@postgres:5432/worksphere
      REDIS_URL: redis://redis:6379
      JWT_SECRET: worksphere-super-secure-jwt-secret-key-2026
      JWT_REFRESH_SECRET: worksphere-super-secure-refresh-key-2026
      WEBHOOK_SECRET: whsec_worksphere_signature_secret_test_key_99
      ANALYTICS_SERVICE_URL: http://analytics:8000
      ANALYTICS_API_KEY: ws-analytics-secret-key-prod-2026
    ports:
      - "4000:4000"
    networks:
      - worksphere-net

  analytics:
    build:
      context: ./services/analytics
      dockerfile: ../../docker/Dockerfile.analytics
    container_name: worksphere-analytics
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      PORT: 8000
    ports:
      - "8000:8000"
    networks:
      - worksphere-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: worksphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    networks:
      - worksphere-net

  nginx:
    image: nginx:alpine
    container_name: worksphere-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - analytics
    networks:
      - worksphere-net

volumes:
  postgres_data:
  redis_data:

networks:
  worksphere-net:
    driver: bridge
