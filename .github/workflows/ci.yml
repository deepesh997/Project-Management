name: WorkSphere Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Test Suite (Supertest & OCC Verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  analytics-test:
    name: FastAPI Analytics & Streaming Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: services/analytics
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        working-directory: services/analytics
        env:
          PYTHONPATH: ".:worksphere_analytics"
        run: pytest

      - name: Run 50k Streaming Benchmark
        working-directory: services/analytics
        env:
          PYTHONPATH: ".:worksphere_analytics"
        run: python tests/benchmark.py

  frontend-test:
    name: Next.js Frontend Architecture & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

  security-audit:
    name: Dependency & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Secrets Exposure
        run: |
          echo "Verifying no live production secrets are committed..."
          ! grep -rn "SUPER_SECRET" . --exclude-dir={.git,node_modules}
