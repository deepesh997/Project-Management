<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="180" r="140" fill="#007AFF" opacity="0.18" filter="url(#glow)" />
  <circle cx="620" cy="380" r="160" fill="#AF52DE" opacity="0.15" filter="url(#glow)" />

  <!-- Grid Blueprint Pattern -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="80" y1="80" x2="720" y2="80" />
    <line x1="80" y1="160" x2="720" y2="160" />
    <line x1="80" y1="240" x2="720" y2="240" />
    <line x1="80" y1="320" x2="720" y2="320" />
    <line x1="80" y1="400" x2="720" y2="400" />
    <line x1="80" y1="480" x2="720" y2="480" />
    <line x1="160" y1="80" x2="160" y2="520" />
    <line x1="280" y1="80" x2="280" y2="520" />
    <line x1="400" y1="80" x2="400" y2="520" />
    <line x1="520" y1="80" x2="520" y2="520" />
    <line x1="640" y1="80" x2="640" y2="520" />
  </g>

  <!-- Central WorkSphere Core Shield -->
  <g transform="translate(100, 100)">
    <!-- Main Showcase Window Card -->
    <rect x="0" y="0" width="600" height="400" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect x="0" y="0" width="600" height="44" rx="16" fill="#0F172A" />
    <circle cx="24" cy="22" r="5" fill="#EF4444" opacity="0.9" />
    <circle cx="42" cy="22" r="5" fill="#F59E0B" opacity="0.9" />
    <circle cx="60" cy="22" r="5" fill="#10B981" opacity="0.9" />
    <text x="300" y="27" fill="#94A3B8" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">WorkSphere • Multi-Tenant Automation Platform</text>

    <!-- Column 1: Kanban To Do -->
    <rect x="24" y="64" width="168" height="312" rx="12" fill="#020617" fill-opacity="0.6" stroke="#334155" stroke-opacity="0.4" />
    <text x="40" y="92" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">TO DO</text>
    <rect x="156" y="80" width="22" height="16" rx="4" fill="#334155" />
    <text x="167" y="92" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>

    <!-- Card 1 in Col 1 -->
    <rect x="36" y="110" width="144" height="96" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="48" y="132" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="700">task-103 • v1</text>
    <text x="48" y="152" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">HMAC Ingestion</text>
    <text x="48" y="168" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">SHA256 &amp; Replay</text>
    <rect x="48" y="180" width="48" height="14" rx="4" fill="#F59E0B" fill-opacity="0.2" />
    <text x="72" y="190" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">MEDIUM</text>

    <!-- Column 2: In Progress -->
    <rect x="216" y="64" width="168" height="312" rx="12" fill="#020617" fill-opacity="0.6" stroke="#007AFF" stroke-opacity="0.4" />
    <text x="232" y="92" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">IN PROGRESS</text>
    <rect x="348" y="80" width="22" height="16" rx="4" fill="#007AFF" fill-opacity="0.4" />
    <text x="359" y="92" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">1</text>

    <!-- Card 1 in Col 2 (Active Focus Card) -->
    <rect x="228" y="110" width="144" height="114" rx="8" fill="#1E293B" stroke="#007AFF" stroke-width="1.5" />
    <text x="240" y="132" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="700">task-101 • OCC v3</text>
    <text x="240" y="152" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Database Sharding</text>
    <text x="240" y="168" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">Supabase Postgres 16</text>
    <rect x="240" y="178" width="120" height="6" rx="3" fill="#334155" />
    <rect x="240" y="178" width="84" height="6" rx="3" fill="#007AFF" />
    <text x="240" y="206" fill="#34D399" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">70% Completed</text>

    <!-- Column 3: Completed / Analytics -->
    <rect x="408" y="64" width="168" height="312" rx="12" fill="#020617" fill-opacity="0.6" stroke="#34D399" stroke-opacity="0.4" />
    <text x="424" y="92" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">COMPLETED</text>
    <rect x="540" y="80" width="22" height="16" rx="4" fill="#059669" fill-opacity="0.4" />
    <text x="551" y="92" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3</text>

    <!-- Metrics Widget in Col 3 -->
    <rect x="420" y="110" width="144" height="96" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1" />
    <text x="432" y="132" fill="#34D399" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">Team Health Score</text>
    <text x="432" y="164" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">94<tspan font-size="14" fill="#94A3B8">/100</tspan></text>
    <text x="432" y="190" fill="#10B981" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">↑ 14% this sprint</text>
  </g>

  <!-- Floating Badges / Security Credentials -->
  <g transform="translate(140, 480)">
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" />
    <circle cx="18" cy="18" r="5" fill="#38BDF8" />
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">OCC Collision Shield</text>
  </g>

  <g transform="translate(320, 480)">
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#0F172A" stroke="#10B981" stroke-opacity="0.4" />
    <circle cx="18" cy="18" r="5" fill="#10B981" />
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">PostgreSQL Tenant RLS</text>
  </g>

  <g transform="translate(500, 480)">
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#0F172A" stroke="#A855F7" stroke-opacity="0.4" />
    <circle cx="18" cy="18" r="5" fill="#A855F7" />
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">FastAPI Analytics 8000</text>
  </g>
</svg>
